<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>源集 · 分类结果</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/app.css">
  <script defer src="assets/icons.js"></script>
  <script defer src="assets/app.js"></script>
  <script defer src="assets/pages.js"></script>
</head>
<body data-page="listing">
  <header class="site-header" id="site-header"></header>
  <main class="wrap page">
    <nav class="crumb" aria-label="当前位置"><a href="01-home.html">首页</a><span>/</span><span id="list-crumb">日用百货 / 杯壶水具</span></nav>
    <div class="title-line"><h1 id="list-title">保温杯</h1><p role="status">找到 <strong id="result-count" class="num">0</strong> 件商品</p></div>
    <div class="chips" id="filters-active" aria-label="已选筛选条件"></div>
    <div class="listing-layout">
      <aside class="panel filter-panel">
        <h2 id="filter-title">筛选商品</h2>
        <form id="filters" aria-labelledby="filter-title">
          <fieldset><legend>价格区间</legend><div class="price-range"><input name="min" type="number" min="0" step=".01" placeholder="¥ 0" aria-label="最低首档单价"><span>–</span><input name="max" type="number" min="0" step=".01" placeholder="¥ 不限" aria-label="最高首档单价"></div></fieldset>
          <div id="filter-options"></div>
          <button class="button primary full" type="submit">应用筛选</button>
        </form>
      </aside>
      <section class="panel result-panel" aria-label="商品结果">
        <div class="result-toolbar">
          <div class="sort" aria-label="排序">
            <button type="button" data-sort="recommended" aria-pressed="true">综合</button><button type="button" data-sort="price" aria-pressed="false">价格 <span aria-hidden="true">↕</span></button><button type="button" data-sort="sold" aria-pressed="false">成交量 <span aria-hidden="true">↕</span></button><button type="button" data-sort="lead" aria-pressed="false">交期 <span aria-hidden="true">↕</span></button>
          </div>
          <div class="segments" aria-label="布局">
            <button type="button" data-view="grid" aria-pressed="false"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>网格</button><button type="button" data-view="list" aria-pressed="true"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg>对比列表</button>
          </div>
        </div>
        <div class="compare-tools"><strong id="compare-count">已勾选 0 / 4</strong><label class="choice"><input type="checkbox" id="only-selected">仅看已选</label><details id="trial" class="trial"><summary>按采购量试算</summary><div class="trial-body"><label for="trial-qty">计划采购件数</label><input id="trial-qty" type="number" min="1" step="1" value="500"><div id="trial-results" aria-live="polite"></div></div></details></div>
        <div id="results"></div>
        <nav id="pagination" class="pagination" aria-label="结果分页"></nav>
      </section>
      <aside class="panel inquiry-dock" aria-labelledby="dock-title">
        <h2 id="dock-title">询价篮 <span class="badge" id="dock-count">0</span></h2>
        <ul class="dock-list" id="dock-list"></ul>
        <a class="button primary full" href="04-workbench.html?tab=inquiry">去工作台询价</a>
      </aside>
    </div>
  </main>
  <footer class="site-footer wrap">源集 YUANJI <span>价格筛选按首档单价 · 数据仅供演示</span></footer>
</body>
</html>
