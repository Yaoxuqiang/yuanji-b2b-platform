<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>源集 · 商品详情</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/app.css">
  <script defer src="assets/icons.js"></script>
  <script defer src="assets/app.js"></script>
  <script defer src="assets/pages.js"></script>
</head>
<body data-page="detail">
  <header class="site-header" id="site-header"></header>
  <main class="wrap page">
    <nav class="crumb" aria-label="当前位置"><a href="01-home.html">首页</a><span>/</span><a id="detail-category" href="02-listing.html">日用百货</a><span>/</span><span>商品详情</span></nav>
    <div id="detail-missing" class="panel empty" hidden><h1>商品暂时无法展示</h1><a class="button outline" href="02-listing.html">返回商品列表</a></div>
    <div id="detail-content">
      <div class="detail-layout">
        <section class="gallery" aria-label="商品图集"><div class="hero-photo" id="gallery-main"></div><div class="thumbs" id="gallery-thumbs"></div></section>
        <section class="decision" aria-labelledby="product-title">
          <h1 id="product-title">商品详情</h1><div class="product-meta" id="product-meta"></div>
          <section class="quote" aria-labelledby="quote-title"><h2 id="quote-title">阶梯报价</h2><div id="quote-tiers" class="quote-tiers"></div></section>
          <div class="sku-options" id="sku-options"></div>
          <div class="sku-row"><label for="detail-qty">采购数量</label><div class="quantity"><button type="button" data-step="-1" aria-label="减少采购数量">−</button><input id="detail-qty" type="number" step="1"><button type="button" data-step="1" aria-label="增加采购数量">+</button></div><span id="stock-note" class="small"></span></div>
          <p class="estimate">预估金额 <output class="money" id="estimate" aria-live="polite"></output></p>
          <div class="services" id="services"></div>
          <div class="detail-actions"><button type="button" class="button primary" id="add-cart">加入采购车</button><button type="button" class="button outline" id="ask-product">发起询盘</button></div>
        </section>
      </div>
      <section class="supplier-strip" id="supplier-strip" aria-label="供应商档案"></section>
      <div class="bottom-detail"><section aria-labelledby="other-title"><h2 id="other-title">同款比价</h2><div id="other-offers"></div></section><section aria-labelledby="related-title"><h2 id="related-title">关联商品</h2><div class="related" id="related"></div></section></div>
    </div>
  </main>
  <footer class="site-footer wrap">源集 YUANJI <span>报价为演示数据，预估金额不含运费</span></footer>
</body>
</html>
