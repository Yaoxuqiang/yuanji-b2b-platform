<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>源集 · 采购工作台</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/app.css">
  <script defer src="assets/icons.js"></script>
  <script defer src="assets/app.js"></script>
  <script defer src="assets/pages.js"></script>
</head>
<body data-page="workbench">
  <header class="site-header" id="site-header"></header>
  <main class="wrap page">
    <nav class="crumb" aria-label="当前位置"><a href="01-home.html">首页</a><span>/</span><span>采购工作台</span></nav>
    <div class="title-line"><h1>采购工作台</h1><span class="tag">演示数据</span></div>
    <nav class="work-tabs" aria-label="工作台功能">
      <a href="04-workbench.html?tab=cart" data-tab="cart"><svg class="ico" aria-hidden="true"><use href="#i-cart"/></svg>采购车 <span class="badge" data-count="cart">0</span></a>
      <a href="04-workbench.html?tab=inquiry" data-tab="inquiry"><svg class="ico" aria-hidden="true"><use href="#i-inquiry"/></svg>询盘</a>
      <a href="04-workbench.html?tab=order" data-tab="order"><svg class="ico" aria-hidden="true"><use href="#i-file"/></svg>订单</a>
      <a href="04-workbench.html?tab=fav" data-tab="fav"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg>收藏与供应商</a>
      <a href="04-workbench.html?tab=data" data-tab="data"><svg class="ico" aria-hidden="true"><use href="#i-chart"/></svg>数据小结</a>
    </nav>
    <section data-pane="cart" class="work-layout" aria-label="采购车" hidden>
      <div>
        <section class="panel cart-panel" aria-label="采购车商品">
          <div class="cart-tools"><label class="choice"><input id="cart-all" type="checkbox">全选</label><button type="button" class="link" data-batch="spec">改规格</button><button type="button" class="link" data-batch="qty">改数量</button><button type="button" class="link" data-batch="move">移入询价篮</button><button type="button" class="link" data-batch="delete">删除</button></div>
          <div id="cart-lines"></div>
        </section>
        <section class="panel month-panel" aria-labelledby="month-title"><div class="section-head"><h2 id="month-title">本月小结</h2><small class="muted">统计周期：本月</small></div><div data-summary></div></section>
      </div>
      <aside class="work-side">
        <section class="panel work-summary" aria-labelledby="summary-title"><h2 id="summary-title">采购摘要</h2><div id="cart-total" aria-live="polite"></div><button id="cart-inquiry" type="button" class="button primary full">批量询价</button><p class="small muted center">预估金额不含运费</p></section>
        <section class="panel follow-up" aria-labelledby="follow-title"><h2 id="follow-title">待跟进</h2><div id="follow-items"></div></section>
      </aside>
    </section>
    <section data-pane="inquiry" class="secondary-panel" aria-label="询盘" hidden>
      <section class="panel work-summary"><div class="section-head"><h2>待发询价篮</h2><a class="link" href="02-listing.html">继续找货</a></div><div id="work-basket"></div></section>
      <section class="panel work-summary"><h2>询盘记录</h2><div id="inquiry-records"></div></section>
    </section>
    <section data-pane="order" class="panel work-summary" aria-label="订单" hidden><div class="section-head"><h2>履约订单</h2><label>状态 <select id="order-filter"></select></label></div><div id="order-list"></div></section>
    <section data-pane="fav" class="panel work-summary" aria-label="收藏与供应商" hidden><h2>常用供应商</h2><div id="favorite-suppliers"></div><h2 class="sub-heading">收藏商品</h2><div class="product-grid" id="favorite-products"></div></section>
    <section data-pane="data" class="panel work-summary" aria-label="数据小结" hidden><div class="section-head"><h2>采购数据小结</h2><small class="muted">统计周期：本月 · 模拟数据</small></div><div data-summary></div><div id="purchase-chart"></div></section>
  </main>
  <footer class="site-footer wrap">源集 YUANJI <span>采购、询盘和履约均为本地演示</span></footer>
</body>
</html>
